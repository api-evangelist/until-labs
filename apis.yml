aid: until-labs
name: Until Labs
description: 'Until Labs (branded "until") is a San Francisco deep-tech biotechnology
  company developing reversible cryopreservation technology for human donor organs.
  Its mission is to build a "pause button for biology" by safely vitrifying organs
  at ultra-low temperatures without ice formation, then rewarming them for transplant
  — extending the viability window for donor organs and improving transplant outcomes.
  The company builds perfusion hardware, cryoprotective agents, cooling and rewarming
  infrastructure, and organ-health assessment methods, working toward whole-body
  medical hibernation. Co-founded by Laura Deming and Hunter Davis, Until has raised
  over $100M including a $58M Series A (September 2025) led by Founders Fund with
  Lux Capital participating. As a wet-lab hardware and life-sciences company, Until
  publishes no public developer API, SDK, or software platform. This profile was
  surfaced as a Lux Capital portfolio company and enriched from public sources.'
